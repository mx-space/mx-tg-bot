[package]
name = "mx-tg-bot"
version = "0.1.0"
edition = "2024"

[dependencies]
axum = "0.8.9"
chrono = { version = "0.4.45", default-features = false, features = ["serde", "clock", "std"] }
dotenvy = "0.15.7"
hex = "0.4.3"
hmac = "0.13.0"
pulldown-cmark = { version = "0.13.4", default-features = false }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.151", features = ["preserve_order"] }
sha1 = "0.11.0"
sha2 = "0.11.0"
teloxide = { version = "0.17.0", default-features = false, features = ["rustls", "macros"] }
tokio = { version = "1.53.2", features = ["macros", "rt-multi-thread", "signal", "time", "sync"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }

[dev-dependencies]
tower = { version = "0.5.3", features = ["util"] }

[profile.release]
strip = true
lto = "thin"
